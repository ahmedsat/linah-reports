<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linah Reports</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f9fafb;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #6b7280;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.75rem;
      }
      a {
        display: inline-block;
        padding: 0.85rem 1.25rem;
        border: 1px solid #d1d5db;
        border-radius: 0.75rem;
        color: #065f46;
        background: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover,
      a:focus-visible {
        border-color: #059669;
        outline: 2px solid #a7f3d0;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Linah Reports</h1>
      <p>Central hub for published Linah Farms reports.</p>
      <ul>
        <li><a href="2026/medjool-report/">Medjool Report — 2026</a></li>
        <li><a href="2026/medjool-outsource-report/">Medjool Outsource Report — 2026</a></li>
      </ul>
    </main>
  </body>
</html>
